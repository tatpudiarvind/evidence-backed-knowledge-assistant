# The production web server (compose.prod.yaml). It serves the built app and passes /api/ and
# /health/ to the API, so the browser talks to one origin and never reaches the API, the
# database, or a language model directly.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Redirects nginx makes itself use relative URLs, so they work on any published port.
    absolute_redirect off;

    root /usr/share/nginx/html;

    # Docker's own DNS server. The API's address is looked up again every 10 seconds, so a
    # recreated API container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api http://backend:8000;

    # Must stay above the API's MAX_UPLOAD_BYTES (10 MiB by default) plus the form's few extra
    # bytes, so the API, not nginx, answers uploads a little over its limit, with its own message.
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Sent with every response, errors included. A location with an add_header of its own would
    # drop all of these, so the locations below set caching with `expires` instead.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Errors nginx makes itself, in the API's error format. The API's own errors pass through.
    error_page 413 = @request_too_large;
    error_page 502 = @api_unreachable;
    error_page 504 = @api_timeout;

    # The API and its health checks.
    location ~ ^/(api|health)/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Replaces any address the client sent, so the API's rate limits see the real one.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads stream to the API, which applies its own size and time limits as they arrive.
        proxy_request_buffering off;
        # Longer than a language model may take to answer (LLM_TIMEOUT_SECONDS is 120 by default).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # nginx adds this one to every response itself, above.
        proxy_hide_header X-Content-Type-Options;
    }

    location /assets/ {
        # Vite puts a hash of each file's content in its name, so these never change.
        expires 1y;
        gzip on;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Any other path is a page of the app, which is checked for changes on every visit.
        expires -1;
        try_files $uri /index.html;
    }

    location @request_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"request_too_large","message":"The request is too large.","request_id":null}}';
    }

    location @api_unreachable {
        default_type application/json;
        return 502 '{"error":{"code":"api_unreachable","message":"Can\'t reach the API. Check that it\'s running, then try again.","request_id":null}}';
    }

    location @api_timeout {
        default_type application/json;
        return 504 '{"error":{"code":"api_timeout","message":"The API took too long to answer. Try again.","request_id":null}}';
    }
}