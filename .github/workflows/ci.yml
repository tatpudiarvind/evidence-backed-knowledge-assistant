name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      # Integration tests run against real PostgreSQL with pgvector (spec section 11).
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: knowledge_assistant_test
          POSTGRES_USER: knowledge_assistant
          POSTGRES_PASSWORD: local_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge_assistant -d knowledge_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
      TEST_DATABASE_URL: postgresql+psycopg://knowledge_assistant:local_dev_only@localhost:5432/knowledge_assistant_test
      # Fail, rather than skip, the integration tests if the database is unreachable.
      TEST_DATABASE_REQUIRED: "1"
      # Likewise fail, rather than skip, the real-model test if the model is missing.
      TEST_MODEL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install backend from the lock file
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format check
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy app
      - name: Download the embedding model
        run: |
          for attempt in 1 2 3; do
            if uv run --no-sync python -m app.cli download-embedding-model; then
              exit 0
            fi
            echo "Download attempt ${attempt} failed."
            sleep 15
          done
          exit 1
      - name: Test
        run: uv run --no-sync pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  compose-smoke:
    name: compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Validate the Compose file
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Apply migrations
        run: docker compose run --rm backend alembic upgrade head
      - name: Download the embedding model
        run: |
          for attempt in 1 2 3; do
            if docker compose run --rm backend python -m app.cli download-embedding-model; then
              exit 0
            fi
            echo "Download attempt ${attempt} failed."
            sleep 15
          done
          exit 1
      - name: Check the pgvector extension
        run: |
          version="$(echo "SELECT extversion FROM pg_extension WHERE extname = 'vector';" \
            | docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -v ON_ERROR_STOP=1')"
          echo "pgvector extension version: ${version}"
          test -n "${version}"
      - name: Check health endpoints and the web app
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/health/live
          echo
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/health/ready
          echo
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors --output /dev/null http://localhost:5173/
      - name: Check sign-up, upload, indexing, a question, download, and delete through the API
        run: |
          api=http://localhost:8000/api/v1
          jar="$(mktemp)"
          count_chunks() {
            echo "SELECT count(*) FROM document_chunks WHERE document_id = '$1';" \
              | docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -v ON_ERROR_STOP=1'
          }
          printf 'Synthetic smoke-test text.\nProject records are kept for seven years, then deleted.\n' \
            > /tmp/smoke.txt
          curl --fail --silent --show-error -c "$jar" \
            -H 'Content-Type: application/json' -H 'X-CSRF-Protection: 1' \
            -d '{"email":"smoke@example.com","password":"compose smoke test password"}' \
            "$api/auth/register"
          echo
          workspace_id="$(curl --fail --silent --show-error -b "$jar" \
            -H 'Content-Type: application/json' -H 'X-CSRF-Protection: 1' \
            -d '{"name":"Smoke test"}' "$api/workspaces" | jq -r .id)"
          document="$(curl --fail --silent --show-error -b "$jar" -H 'X-CSRF-Protection: 1' \
            -F 'file=@/tmp/smoke.txt;filename=smoke.txt' "$api/workspaces/$workspace_id/documents")"
          echo "$document"
          test "$(echo "$document" | jq -r .status)" = "queued"
          document_id="$(echo "$document" | jq -r .id)"
          # The worker indexes the upload in the background; the first one also loads the model.
          for attempt in $(seq 1 60); do
            document="$(curl --fail --silent --show-error -b "$jar" "$api/documents/$document_id")"
            status="$(echo "$document" | jq -r .status)"
            if [ "$status" != "queued" ] && [ "$status" != "processing" ]; then
              break
            fi
            sleep 2
          done
          echo "$document"
          test "$status" = "ready"
          chunks="$(count_chunks "$document_id")"
          echo "chunks stored: ${chunks}"
          test "$chunks" -gt 0
          # Compose runs without a language model, so the answer lists the matching passages.
          question="$(curl --fail --silent --show-error -b "$jar" \
            -H 'Content-Type: application/json' -H 'X-CSRF-Protection: 1' \
            -d '{"text":"How long are project records kept?"}' \
            "$api/workspaces/$workspace_id/questions")"
          echo "$question"
          test "$(echo "$question" | jq -r .answer.mode)" = "search_only"
          test "$(echo "$question" | jq -r .answer.abstained)" = "false"
          test "$(echo "$question" | jq -r '.answer.citations[0].document_id')" = "$document_id"
          curl --fail --silent --show-error -b "$jar" "$api/documents/$document_id/file" \
            | cmp - /tmp/smoke.txt
          curl --fail --silent --show-error -b "$jar" -H 'X-CSRF-Protection: 1' \
            -X DELETE "$api/documents/$document_id"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -b "$jar" \
            "$api/documents/$document_id")" = "404"
          test "$(count_chunks "$document_id")" = "0"
          # Deleting a document deletes the answers that cite it.
          test "$(curl --fail --silent --show-error -b "$jar" \
            "$api/workspaces/$workspace_id/questions" | jq '.items | length')" = "0"
      - name: Check readiness reports 503 when the database stops
        run: |
          docker compose stop db
          status="$(curl --silent --output /dev/null --max-time 30 --write-out '%{http_code}' http://localhost:8000/health/ready || true)"
          echo "readiness status with the database stopped: ${status}"
          test "${status}" = "503"
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down --volumes
