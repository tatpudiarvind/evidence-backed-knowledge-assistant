# Adds a Keycloak server to the production-style stack, for the sign-in test in CI
# (e2e/tests/oidc.spec.ts). Use it together with compose.prod.yaml:
#   COMPOSE_FILE=compose.prod.yaml:e2e/compose.keycloak.yaml
# The realm's users, passwords, and client secret are throwaway values for tests. Never reuse them.
#
# The API accepts a plain-http issuer only on this computer (localhost). So Keycloak shares the
# API container's network: the API reaches it at http://localhost:8180, and so does the browser
# through the port published here, and the issuer in every token is the same address.
services:
  backend:
    ports:
      - "127.0.0.1:8180:8180"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    network_mode: "service:backend"
    command:
      - start-dev
      - --import-realm
      - --http-port=8180
      - --hostname=http://localhost:8180
    volumes:
      - ./e2e/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ci-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password
    depends_on:
      - backend
