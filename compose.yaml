# The API and its migrations use the same database.
x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:-knowledge_assistant}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-knowledge_assistant}

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    # Ports are published on 127.0.0.1 only, here and below, so other machines can't reach them.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Brings the database schema up to date, then exits; the API starts once it has succeeded.
  migrate:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: *database-url
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
      SIGN_IN_ATTEMPTS_PER_MINUTE: ${SIGN_IN_ATTEMPTS_PER_MINUTE:-10}
      REGISTRATION_ATTEMPTS_PER_HOUR: ${REGISTRATION_ATTEMPTS_PER_HOUR:-10}
      QUESTIONS_PER_MINUTE: ${QUESTIONS_PER_MINUTE:-10}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_DOCUMENTS_PER_WORKSPACE: ${MAX_DOCUMENTS_PER_WORKSPACE:-100}
      UPLOAD_TIMEOUT_SECONDS: ${UPLOAD_TIMEOUT_SECONDS:-120}
      INGESTION_WORKER_ENABLED: ${INGESTION_WORKER_ENABLED:-true}
      CHUNK_SIZE_CHARACTERS: ${CHUNK_SIZE_CHARACTERS:-1000}
      CHUNK_OVERLAP_CHARACTERS: ${CHUNK_OVERLAP_CHARACTERS:-150}
      MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-500}
      MAX_DOCUMENT_CHARACTERS: ${MAX_DOCUMENT_CHARACTERS:-2000000}
      PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-120}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      # Ollama on the host usually listens on 127.0.0.1 only, out of this container's reach,
      # so answers list matching passages unless both COMPOSE_ settings name a reachable server.
      LLM_PROVIDER: ${COMPOSE_LLM_PROVIDER:-none}
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-4096}
      ANSWER_CONTEXT_CHARACTERS: ${ANSWER_CONTEXT_CHARACTERS:-6000}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-4}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.5}
      QUESTION_CLEANUP_ENABLED: ${QUESTION_CLEANUP_ENABLED:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      # Uploaded files (STORAGE_DIR defaults to /app/storage in the image).
      - document_storage:/app/storage
      # The embedding model (EMBEDDING_MODEL_DIR defaults to /app/models in the image). Fetch
      # it once with `docker compose run --rm backend python -m app.cli download-embedding-model`.
      - embedding_models:/app/models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  document_storage:
  embedding_models:
  frontend_node_modules:
