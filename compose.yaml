services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knowledge_assistant}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-knowledge_assistant}
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_DOCUMENTS_PER_WORKSPACE: ${MAX_DOCUMENTS_PER_WORKSPACE:-100}
      INGESTION_WORKER_ENABLED: ${INGESTION_WORKER_ENABLED:-true}
      CHUNK_SIZE_CHARACTERS: ${CHUNK_SIZE_CHARACTERS:-1000}
      CHUNK_OVERLAP_CHARACTERS: ${CHUNK_OVERLAP_CHARACTERS:-150}
      MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-500}
      MAX_DOCUMENT_CHARACTERS: ${MAX_DOCUMENT_CHARACTERS:-2000000}
      PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-120}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      # Uploaded files (STORAGE_DIR defaults to /app/storage in the image).
      - document_storage:/app/storage
      # The embedding model (EMBEDDING_MODEL_DIR defaults to /app/models in the image). Fetch
      # it once with `docker compose run --rm backend python -m app.cli download-embedding-model`.
      - embedding_models:/app/models
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  document_storage:
  embedding_models:
  frontend_node_modules:
